<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Produktivitet - flow</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/app-icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="with-sidebar">
  <header class="topbar"></header>

  <section class="controls">
    <div class="productivity-overview-period-toggle" role="group" aria-label="Period">
      <button type="button" class="active" data-period="day">Dag</button>
      <button type="button" data-period="week">Vecka</button>
      <button type="button" data-period="month">Månad</button>
      <button type="button" data-period="year">År</button>
    </div>
    <label class="productivity-date-field">Datum
      <span class="date-nav productivity-date-nav">
        <button id="productivityOverviewPrevDate" class="date-nav-btn" type="button" aria-label="Föregående datum" title="Föregående datum">‹</button>
        <div class="date-display-wrap" title="Välj datum">
          <span class="date-display-text" id="productivityOverviewDateDisplayText">YYYY-MM-DD</span>
          <input id="productivityOverviewDate" type="date" class="date-display-overlay" aria-label="Välj datum" data-flow-context-date />
        </div>
        <button id="productivityOverviewNextDate" class="date-nav-btn" type="button" aria-label="Nästa datum" title="Nästa datum">›</button>
      </span>
    </label>
    <button id="productivityOverviewRootBtn" type="button">Helbild</button>
    <button id="productivityOverviewExportFlowchart" type="button">Exportera flowchart</button>
  </section>

  <main class="productivity-page productivity-overview-page">
    <div class="section-title">Produktivitet</div>
    <div id="productivityOverviewStatus" class="productivity-status"></div>
    <div id="productivityOverviewProgress" class="fetch-progress" hidden aria-live="polite"></div>
    <div id="productivityOverviewSummary" class="productivity-overview-summary"></div>
    <nav id="productivityOverviewBreadcrumbs" class="productivity-overview-breadcrumbs" aria-label="Produktivitetshierarki"></nav>
    <div id="productivityOverviewTree" class="productivity-overview-tree-wrap"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/desktop_bridge.js"></script>
  <script src="/js/common/foundation.js?v=20260616-speed-common"></script>
  <script src="/js/common/theme.js?v=20260616-speed-common"></script>
  <script src="/js/common/area_focus.js?v=20260616-speed-common"></script>
  <script src="/js/common/runtime.js?v=20260616-speed-common"></script>
  <script src="/js/common/app_log.js?v=20260616-speed-common"></script>
  <script src="/js/common/telemetry.js?v=20260616-speed-common"></script>
  <script src="/js/common/access.js?v=20260616-speed-common"></script>
  <script src="/js/common/sidebar.js?v=20260616-speed-common"></script>
  <script src="/js/common/uploads.js?v=20260616-speed-common"></script>
  <script src="/js/common/demo_prefetch_init.js?v=20260616-speed-common"></script>
  <script src="/js/common/import_tools.js?v=20260616-speed-common"></script>
  <script src="/js/common/table_sort.js?v=20260616-speed-common"></script>
  <script src="/js/common/date_state.js?v=20260616-speed-common"></script>
  <script src="/js/common/period_picker.js?v=20260624-period-picker"></script>
  <script src="/js/common.js?v=20260616-speed-common"></script>
  <script src="/js/productivity_overview.js?v=20260625-productivity-parallel-days"></script>
</body>
</html>
