<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta - flow</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/app-icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="with-sidebar">
  <header class="topbar"></header>

  <section class="tools-page-head" aria-labelledby="tools-title">
    <div class="section-title" id="tools-title">Verktyg</div>
    <nav class="tools-tabs" aria-label="Verktyg">
      <a class="tools-tab" href="/dela.html" data-tools-tab-view="allocationSplit">Dela</a>
      <a class="tools-tab" href="/label-editor.html" data-tools-tab-view="labelEditor">Etiketter</a>
      <a class="tools-tab" href="/mcp.html" data-tools-tab-view="mcp">MCP</a>
      <a class="tools-tab" href="/hamta-data.html" data-tools-tab-view="dataFetch">Hämta data</a>
      <a class="tools-tab" href="/historik.html" data-tools-tab-view="analytics">Historik</a>
      <a class="tools-tab active" href="/meta.html" aria-current="page" data-tools-tab-view="meta">Meta</a>
    </nav>
  </section>

  <section class="controls meta-admin-controls">
    <label>Sök
      <input id="metaSearch" class="meta-search-input" type="search" placeholder="Sök i sändningsanalys" autocomplete="off" />
    </label>
    <button id="metaRefresh">Uppdatera</button>
    <button id="metaExportFiltered" type="button" disabled>Exportera filtrerade</button>
    <button id="metaExportAll" type="button" disabled>Exportera alla</button>
  </section>

  <main>
    <div class="section-title-with-action">
      <div class="section-title">Meta</div>
      <div id="metaSummary" class="meta-admin-summary"></div>
    </div>

    <section class="meta-admin-observations" aria-labelledby="metaShipmentTitle">
      <div class="section-title-with-action compact">
        <h2 id="metaShipmentTitle">Sändningsanalys</h2>
        <div id="metaShipmentSummary" class="meta-admin-summary"></div>
      </div>
      <div class="meta-admin-table-wrap">
        <table class="meta-admin-table">
          <thead>
            <tr>
              <th><button type="button" class="meta-sort-button" data-sort-key="order_number">Ordernummer</button></th>
              <th><button type="button" class="meta-sort-button" data-sort-key="shipment_number">Sändningsnummer</button></th>
              <th><button type="button" class="meta-sort-button" data-sort-key="username">Användarnamn</button></th>
              <th><button type="button" class="meta-sort-button" data-sort-key="customer_name">Kund</button></th>
              <th><button type="button" class="meta-sort-button" data-sort-key="pallet_id">Pall-ID</button></th>
              <th><button type="button" class="meta-sort-button" data-sort-key="deviations">Avvikelser</button></th>
              <th><button type="button" class="meta-sort-button" data-sort-key="analysis_status">Status</button></th>
              <th><button type="button" class="meta-sort-button" data-sort-key="updated_at">Uppdaterad</button></th>
              <th><button type="button" class="meta-sort-button" data-sort-key="video_filename">Video</button></th>
              <th><button type="button" class="meta-sort-button" data-sort-key="video_duration_seconds">Längd</button></th>
              <th><button type="button" class="meta-sort-button" data-sort-key="video_size_bytes">Storlek</button></th>
              <th><button type="button" class="meta-sort-button" data-sort-key="record_hash">Rad-ID</button></th>
              <th>Åtgärd</th>
            </tr>
          </thead>
          <tbody id="metaShipmentRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/common/foundation.js?v=20260616-speed-common"></script>
  <script src="/js/common/theme.js?v=20260616-speed-common"></script>
  <script src="/js/common/area_focus.js?v=20260616-speed-common"></script>
  <script src="/js/common/runtime.js?v=20260616-speed-common"></script>
  <script src="/js/common/app_log.js?v=20260616-speed-common"></script>
  <script src="/js/common/telemetry.js?v=20260616-speed-common"></script>
  <script src="/js/common/access.js?v=20260616-speed-common"></script>
  <script src="/js/common/sidebar.js?v=20260616-speed-common"></script>
  <script src="/js/common/uploads.js?v=20260616-speed-common"></script>
  <script src="/js/common/demo_prefetch_init.js?v=20260616-speed-common"></script>
  <script src="/js/common/import_tools.js?v=20260616-speed-common"></script>
  <script src="/js/common/table_sort.js?v=20260616-speed-common"></script>
  <script src="/js/common/date_state.js?v=20260616-speed-common"></script>
  <script src="/js/common.js?v=20260616-speed-common"></script>
  <script src="/js/meta.js"></script>
</body>
</html>
