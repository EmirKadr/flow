<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leverantörspridning &amp; D-paks-information - flow</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/app-icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="public-dpak-page">
  <main class="public-dpak-shell">
    <section class="public-dpak-chat-surface" aria-labelledby="publicDpakTitle">
      <header class="public-dpak-head">
        <div class="public-dpak-brand">
          <div class="public-dpak-logos" aria-label="No Waste Logistics och Mestergruppen">
            <img src="/assets/nowaste-logo.png" alt="No Waste Logistics" />
            <span aria-hidden="true"></span>
            <img src="/assets/mestergruppen-logo.png" alt="Mestergruppen" />
          </div>
          <h1 id="publicDpakTitle">Leverantörspridning &amp; D-paks-information</h1>
        </div>
        <div class="public-dpak-head-meta">
          <div id="publicDpakStatus" class="public-dpak-status" aria-live="polite">Kontrollerar underlag...</div>
        </div>
      </header>

      <div id="publicDpakMessages" class="public-dpak-messages" role="log" aria-live="polite"></div>

      <form id="publicDpakForm" class="public-dpak-form">
        <div class="public-dpak-input-stack">
          <textarea
            id="publicDpakInput"
            rows="3"
            spellcheck="true"
            placeholder="Ställ en fråga om D-pak, zon R, AUTOSTORE eller leverantörer..."
          ></textarea>
          <div id="publicDpakVoiceStatus" class="public-dpak-voice-status" aria-live="polite"></div>
        </div>
        <div class="public-dpak-actions">
          <button id="publicDpakVoice" type="button" class="public-dpak-secondary public-dpak-voice" aria-pressed="false">Spela in</button>
          <button id="publicDpakClear" type="button" class="public-dpak-secondary">Rensa</button>
          <button id="publicDpakSend" type="submit" class="public-dpak-primary">Skicka</button>
        </div>
      </form>
    </section>
  </main>

  <div id="publicDpakTableModal" class="public-dpak-table-modal" hidden>
    <section class="public-dpak-table-modal-panel" role="dialog" aria-modal="true" aria-labelledby="publicDpakTableModalTitle">
      <header class="public-dpak-table-modal-head">
        <h2 id="publicDpakTableModalTitle">Tabell</h2>
        <button id="publicDpakCloseTable" type="button" class="public-dpak-secondary">Stäng</button>
      </header>
      <div id="publicDpakTableModalBody" class="public-dpak-table-modal-body"></div>
    </section>
  </div>

  <script src="/js/public_dpak_chat.js?v=20260708-public-dpak-voice"></script>
</body>
</html>
