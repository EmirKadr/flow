<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hämta data - flow</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/app-icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="with-sidebar">
  <header class="topbar"></header>

  <section class="tools-page-head" aria-labelledby="tools-title">
    <div class="section-title" id="tools-title">Verktyg</div>
    <nav class="tools-tabs" aria-label="Verktyg">
      <a class="tools-tab" href="/dela.html" data-tools-tab-view="allocationSplit">Dela</a>
      <a class="tools-tab" href="/label-editor.html" data-tools-tab-view="labelEditor">Etiketter</a>
      <a class="tools-tab" href="/mcp.html" data-tools-tab-view="mcp">MCP</a>
      <a class="tools-tab active" href="/hamta-data.html" aria-current="page" data-tools-tab-view="dataFetch">Hämta data</a>
      <a class="tools-tab" href="/historik.html" data-tools-tab-view="analytics">Historik</a>
      <a class="tools-tab" href="/meta.html" data-tools-tab-view="meta">Meta</a>
    </nav>
  </section>

  <main class="data-fetch-page">
    <div class="section-title">Hämta data</div>

    <section class="data-fetch-panel">
      <div class="data-fetch-panel-head">
        <div>
          <h2>Prompt</h2>
          <p id="dataFetchHealth" class="note" hidden></p>
        </div>
      </div>
      <textarea
        id="dataFetchPrompt"
        rows="5"
        spellcheck="true"
        placeholder="Exempel: Exportera aktivitetsloggen där typ är korrigering. Visa typ, artikel och datum."
      ></textarea>
      <div class="data-fetch-actions">
        <label>Max rader
          <input id="dataFetchMaxRows" type="number" min="1" max="5000" />
        </label>
        <button id="dataFetchPlan" type="button" class="primary">Tolka</button>
        <button id="dataFetchRun" type="button" disabled>Hämta data</button>
        <button id="dataFetchExport" type="button" disabled>Exportera Excel</button>
      </div>
      <p class="note">Sekretess: MiniMax får vy- och kolumnstruktur, men aldrig URL, API-nycklar eller anslutningsvärden.</p>
      <div id="dataFetchStatus" class="data-fetch-status"></div>
    </section>

    <section id="dataFetchPlanPanel" class="data-fetch-panel" hidden></section>
    <section id="dataFetchResultPanel" class="data-fetch-panel" hidden></section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/common/foundation.js?v=20260616-speed-common"></script>
  <script src="/js/common/theme.js?v=20260616-speed-common"></script>
  <script src="/js/common/area_focus.js?v=20260616-speed-common"></script>
  <script src="/js/common/runtime.js?v=20260616-speed-common"></script>
  <script src="/js/common/app_log.js?v=20260616-speed-common"></script>
  <script src="/js/common/telemetry.js?v=20260616-speed-common"></script>
  <script src="/js/common/access.js?v=20260616-speed-common"></script>
  <script src="/js/common/sidebar.js?v=20260616-speed-common"></script>
  <script src="/js/common/uploads.js?v=20260616-speed-common"></script>
  <script src="/js/common/demo_prefetch_init.js?v=20260616-speed-common"></script>
  <script src="/js/common/import_tools.js?v=20260616-speed-common"></script>
  <script src="/js/common/table_sort.js?v=20260616-speed-common"></script>
  <script src="/js/common/date_state.js?v=20260616-speed-common"></script>
  <script src="/js/common.js?v=20260616-speed-common"></script>
  <script src="/js/data_fetch.js?v=20260615-calculation"></script>
</body>
</html>
