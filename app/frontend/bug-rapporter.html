<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buggrapporter - flow</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/app-icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/vendor-rrweb.min.css" />
  <style>
    .bug-reports-page { padding: 16px 24px 48px; max-width: 1200px; }
    .bug-reports-meta { color: var(--muted, #777); font-size: 12px; margin: 4px 0 12px; }
    table.bug-reports-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.bug-reports-table th, table.bug-reports-table td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border, #eee); }
    table.bug-reports-table th { font-weight: 600; }
    table.bug-reports-table tr { cursor: pointer; }
    table.bug-reports-table tr.active { background: var(--hover, #f2f6ff); }
    .bug-report-id { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted, #666); }
    .bug-status-new { color: #b3261e; font-weight: 600; }
    .bug-status-seen { color: #b35900; font-weight: 600; }
    .bug-status-done { color: #1a7f37; font-weight: 600; }
    .bug-report-detail { margin-top: 18px; }
    .bug-report-detail .detail-meta { font-size: 13px; margin-bottom: 10px; }
    .bug-report-detail .detail-actions { display: flex; gap: 8px; margin: 10px 0; }
    .bug-report-context { font-size: 12px; background: var(--card, #f7f7f7); border: 1px solid var(--border, #ddd); border-radius: 8px; padding: 10px 14px; margin-top: 12px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
    td.bug-report-actions { white-space: nowrap; }
    td.bug-report-actions select { margin-right: 6px; }
    td.bug-report-actions button { font-size: 12px; padding: 3px 8px; }
  </style>
</head>
<body class="with-sidebar">
  <header class="topbar"></header>

  <main class="bug-reports-page">
    <div class="section-title">Buggrapporter</div>
    <p class="bug-reports-meta">
      Inspelningar som användare skickat in via Bugg-knappen: 30 sekunder av vad
      användaren såg och gjorde i appen, plus tekniska fel. Klicka på en rad för
      att spela upp. Rapporter raderas automatiskt efter 30 dagar.
    </p>

    <table class="bug-reports-table">
      <thead>
        <tr>
          <th>ID</th><th>Skickad</th><th>Användare</th><th>Vy</th><th>Notis</th><th>Status</th><th>Storlek</th><th>Åtgärder</th>
        </tr>
      </thead>
      <tbody id="bugReportsBody"><tr><td colspan="8">Laddar …</td></tr></tbody>
    </table>

    <section class="bug-report-detail" id="bugReportDetail" hidden>
      <div class="section-title" id="bugReportTitle"></div>
      <div class="detail-meta" id="bugReportMeta"></div>
      <div class="detail-actions">
        <button type="button" id="bugReportReplay">Spela upp igen</button>
        <button type="button" class="secondary" id="bugReportMarkSeen">Markera som att göra</button>
        <button type="button" class="secondary" id="bugReportMarkDone">Markera som klar</button>
        <button type="button" class="danger" id="bugReportDelete">Ta bort</button>
      </div>
      <div class="bug-report-player" id="bugReportPlayer"></div>
      <div class="bug-report-context" id="bugReportContext" hidden></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/common/foundation.js?v=20260616-speed-common"></script>
  <script src="/js/common/theme.js?v=20260616-speed-common"></script>
  <script src="/js/common/area_focus.js?v=20260616-speed-common"></script>
  <script src="/js/common/runtime.js?v=20260616-speed-common"></script>
  <script src="/js/common/app_log.js?v=20260616-speed-common"></script>
  <script src="/js/common/telemetry.js?v=20260616-speed-common"></script>
  <script src="/js/common/access.js?v=20260616-speed-common"></script>
  <script src="/js/common/sidebar.js?v=20260616-speed-common"></script>
  <script src="/js/common/uploads.js?v=20260616-speed-common"></script>
  <script src="/js/common/demo_prefetch_init.js?v=20260616-speed-common"></script>
  <script src="/js/common/import_tools.js?v=20260616-speed-common"></script>
  <script src="/js/common/table_sort.js?v=20260616-speed-common"></script>
  <script src="/js/common/date_state.js?v=20260616-speed-common"></script>
  <script src="/js/common.js?v=20260616-speed-common"></script>
  <script src="/js/vendor/rrweb.min.js"></script>
  <script src="/js/bug_reports_admin.js?v=20260707-bug-actions"></script>
</body>
</html>
