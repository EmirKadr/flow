<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Sankey - Inbound - flow</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/app-icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="with-sidebar">
  <header class="topbar"></header>

  <section class="controls sankey-inbound-controls">
    <div class="productivity-overview-period-toggle" role="group" aria-label="Period">
      <button type="button" class="active" data-sankey-period="day">Dag</button>
      <button type="button" data-sankey-period="week">Vecka</button>
      <button type="button" data-sankey-period="month">Månad</button>
      <button type="button" data-sankey-period="year">År</button>
    </div>
    <label class="productivity-date-field">Datum
      <span class="date-nav productivity-date-nav">
        <button id="sankeyInboundPrevDate" class="date-nav-btn" type="button" aria-label="Föregående datum" title="Föregående datum">‹</button>
        <div class="date-display-wrap" title="Välj datum">
          <span class="date-display-text" id="sankeyInboundDateDisplayText">YYYY-MM-DD</span>
          <input id="sankeyInboundDate" type="date" class="date-display-overlay" aria-label="Välj datum" />
        </div>
        <button id="sankeyInboundNextDate" class="date-nav-btn" type="button" aria-label="Nästa datum" title="Nästa datum">›</button>
      </span>
    </label>
    <label>Bolag
      <select id="sankeyInboundCompany">
        <option value="ALL">Alla bolag</option>
      </select>
    </label>
    <button id="sankeyInboundOnlyConsumed" type="button" aria-pressed="false">Visa endast förverkade</button>
    <button id="sankeyInboundReset" type="button">Återställ vy</button>
    <button id="sankeyInboundExport" type="button">Exportera SVG</button>
    <button id="sankeyInboundExportTraceAll" type="button">Exportera spårning</button>
  </section>

  <main class="sankey-inbound-page">
    <div class="section-title">Sankey - Inbound</div>
    <div id="sankeyInboundStatus" class="productivity-status"></div>
    <div id="sankeyInboundProgress" class="fetch-progress" hidden aria-live="polite"></div>
    <section id="sankeyInboundSummary" class="sankey-inbound-summary"></section>
    <section class="sankey-inbound-layout">
      <div id="sankeyInboundChart" class="sankey-inbound-chart" aria-label="Sankeydiagram"></div>
      <aside id="sankeyInboundDetail" class="sankey-inbound-detail" aria-live="polite"></aside>
    </section>
    <section class="sankey-inbound-bottom">
      <div id="sankeyInboundProcessTable" class="sankey-inbound-table-wrap"></div>
      <div id="sankeyInboundWarnings" class="sankey-inbound-warnings"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/desktop_bridge.js"></script>
  <script src="/js/common/foundation.js?v=20260616-speed-common"></script>
  <script src="/js/common/theme.js?v=20260616-speed-common"></script>
  <script src="/js/common/area_focus.js?v=20260616-speed-common"></script>
  <script src="/js/common/runtime.js?v=20260616-speed-common"></script>
  <script src="/js/common/app_log.js?v=20260616-speed-common"></script>
  <script src="/js/common/telemetry.js?v=20260616-speed-common"></script>
  <script src="/js/common/access.js?v=20260616-speed-common"></script>
  <script src="/js/common/sidebar.js?v=20260616-speed-common"></script>
  <script src="/js/common/uploads.js?v=20260616-speed-common"></script>
  <script src="/js/common/demo_prefetch_init.js?v=20260616-speed-common"></script>
  <script src="/js/common/import_tools.js?v=20260616-speed-common"></script>
  <script src="/js/common/table_sort.js?v=20260616-speed-common"></script>
  <script src="/js/common/date_state.js?v=20260616-speed-common"></script>
  <script src="/js/common/period_picker.js?v=20260624-period-picker"></script>
  <script src="/js/common.js?v=20260616-speed-common"></script>
  <script src="/js/sankey_inbound.js?v=20260625-sankey-client-filters"></script>
</body>
</html>
