apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-web
  namespace: flow
  labels:
    app.kubernetes.io/name: flow
    app.kubernetes.io/component: web
spec:
  replicas: 1                 # stateful (RWO-volymer) → börja med 1, skala vertikalt
  strategy:
    type: Recreate           # RWO kan inte mountas av två poddar samtidigt
  selector:
    matchLabels:
      app.kubernetes.io/name: flow
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000       # 'flow'-användaren i imagen
        runAsGroup: 1000
        fsGroup: 1000         # gör monterade PVC:er skrivbara för uid 1000
      # Kopierar in bundlad referensdata i flow-data-volymen vid första start.
      # 'cp -rn' skriver aldrig över filer användare laddat upp senare.
      initContainers:
        - name: seed-data
          image: REGISTRY/flow:latest   # samma image som main-containern
          command: ["sh", "-c", "cp -rn /repo/data/. /persistent-data/ || true"]
          volumeMounts:
            - name: flow-data
              mountPath: /persistent-data
      containers:
        - name: flow-web
          image: REGISTRY/flow:latest    # <-- byt till ert registry, t.ex. ghcr.io/dole/flow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: flow-config
            - secretRef:
                name: flow-secrets
          volumeMounts:
            - name: flow-data
              mountPath: /repo/data
            - name: flow-media
              mountPath: /var/flow-media
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            # Tål korta CPU-toppar (t.ex. ffmpeg i meta-analysen) utan pod-kill.
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
      volumes:
        - name: flow-data
          persistentVolumeClaim:
            claimName: flow-data
        - name: flow-media
          persistentVolumeClaim:
            claimName: flow-media
