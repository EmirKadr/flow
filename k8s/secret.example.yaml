# MALL — kopiera till secret.yaml, fyll i riktiga värden och applicera den.
# secret.yaml är gitignorad (se k8s/.gitignore). Committa ALDRIG riktiga nycklar.
#
# Skapa hellre direkt med kubectl (då hamnar inga klartext-värden i en fil):
#
#   kubectl -n flow create secret generic flow-secrets \
#     --from-literal=DATABASE_URL='postgresql+psycopg://USER:PASS@HOST:5432/flow' \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets;print(secrets.token_hex(32))')" \
#     --from-literal=EXCEL_API_TOKEN="$(python -c 'import secrets;print(secrets.token_hex(32))')"
#
apiVersion: v1
kind: Secret
metadata:
  name: flow-secrets
  namespace: flow
  labels:
    app.kubernetes.io/name: flow
type: Opaque
stringData:
  # --- Obligatoriska ---
  DATABASE_URL: "postgresql+psycopg://USER:PASS@HOST:5432/flow"
  SECRET_KEY: "ERSATT-MED-token_hex(32)"

  # --- Rekommenderade ---
  EXCEL_API_TOKEN: "ERSATT-eller-ta-bort-om-Excel-export-ej-anvands"

  # --- Extern datakälla (ASK/Nowaste): hemliga delar ---
  DATA_SOURCE_API_BASE_URL: "https://noeffectui-frey-development.nowastelogistics.com"
  DATA_SOURCE_API_KEY: ""
  DATA_SOURCE_API_CLIENT: "nowaste-internal-emir"
  # DATA_SOURCE_CA_BUNDLE: ""        # bara om intern PKI kräver det
  # DATA_SOURCE_CATALOG_JSON: ""     # bara om default-katalogen inte räcker

  # --- AI-assistent (MiniMax): utelämna hela blocket om assistenten ej ska användas ---
  MINIMAX_API_KEY: ""
