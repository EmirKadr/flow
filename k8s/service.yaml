apiVersion: v1
kind: Service
metadata:
  name: flow-web
  namespace: flow
  labels:
    app.kubernetes.io/name: flow
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flow
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 8000
