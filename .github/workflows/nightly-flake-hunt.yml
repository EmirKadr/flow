# Nattlig flake-jakt: kör browsersviten 3x utan omkörningar. En instabil
# browsertest ska upptäckas här - systematiskt och utan att blockera någons
# push - i stället för när den fäller en CI-körning mitt i ett releasearbete.
# Vid fel öppnas en issue med länk till körningen.
name: Nightly flake hunt

# `push` deklareras men de tunga stegen skippas på push (if på STEG-nivå).
# Bakgrund (lärt 2026-07-06): ett `if` på JOBB-nivå som exkluderar push gör att
# GitHub kör noll jobb → körningen rapporteras som "No jobs were run" = FAILURE
# och mejlar vid varje push. Lösningen är att låta jobbet ALLTID köra minst ett
# (trivialt) steg så körningen blir grön, och gardera de dyra stegen på
# stegnivå. Kontraktet i tests/tools/test_workflow_contracts.py håller detta.
on:
  push:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC varje natt
  workflow_dispatch: {}    # manuell körning vid behov

permissions:
  contents: read
  issues: write

jobs:
  browser-flake-hunt:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      FLOW_DISABLE_UPDATE_CHECK: "1"
      SECRET_KEY: test-secret
      SUPER_USER_USERNAMES: admin,emikad,mikhal
      EXCEL_API_TOKEN: test-token

    steps:
      # Kör alltid (även på push) så jobbet instansieras och blir grönt -
      # utan detta blir push en tom "No jobs were run"-failure.
      - name: Event-gate
        run: echo "event=${{ github.event_name }} - flake-jakten kör bara schemalagt/manuellt; push skippar de tunga stegen."

      - name: Check out repository
        if: github.event_name != 'push'
        uses: actions/checkout@v7

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        if: github.event_name != 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        if: github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run browser suite 3x (no retries)
        if: github.event_name != 'push'
        run: |
          for round in 1 2 3; do
            echo "=== Flake-jakt: runda $round/3 ==="
            python -m pytest -m browser -q
          done

      - name: Open issue on instability
        if: failure() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flake-jakt: browsersviten instabil $(date -u +%F)" \
            --body "Nattliga flake-jakten foll. Korning: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} - regel (wiki/test-strategi.md): rotorsaka eller karantansatt testet, flakes far inte normaliseras."
