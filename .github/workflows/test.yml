name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flow_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QT_QPA_PLATFORM: offscreen
      FLOW_DISABLE_UPDATE_CHECK: "1"
      SECRET_KEY: test-secret
      SUPER_USER_USERNAMES: admin,emikad,mikhal
      EXCEL_API_TOKEN: test-token

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Simulate Alembic build (Postgres)
        working-directory: app
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/flow_test
          ENVIRONMENT: production
        run: |
          alembic upgrade head
          python -c "from backend.main import app; print(app.title)"

      # Icke-browsersviten körs parallellt (xdist). Browsertesterna körs
      # separat med max 2 omkörningar: de är lastkänsliga (Playwright-timing)
      # och CI är deras enda gate sedan pre-push kör -m "not browser".
      # Omkörningar syns i loggen ("RERUN") - återkommande sådana ska
      # rotorsakas, inte normaliseras (se wiki/test-strategi.md).
      - name: Run pytest (non-browser, parallel)
        run: python -m pytest -m "not browser" -n auto

      - name: Run pytest (browser, with retries)
        run: python -m pytest -m browser --reruns 2 --reruns-delay 5

      - name: Check frontend JavaScript syntax
        run: |
          find app/frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install frontend check dependencies
        run: npm ci

      - name: Dependency audit (pip runtime + npm)
        run: |
          python -m pip install pip-audit
          pip-audit -r app/requirements.txt
          npm audit --audit-level=high

      - name: Frontend type check (JSDoc + tsc --checkJs)
        run: npm run typecheck

      - name: Frontend lint (ESLint)
        run: npm run lint

      - name: API types in sync (OpenAPI -> api-schema.d.ts)
        env:
          DATABASE_URL: "sqlite:///./typegen-tmp.db"
        run: |
          python -m tools.generate_api_types
          git diff --exit-code app/frontend/js/types/api-schema.d.ts

      - name: Run desktop smoke test
        run: python desktop/main.py --smoke-test

  # Produktionsdatabasen (NoWaste/Azure) ar SQL Server. Gaten bygger schemat
  # fran noll med alembic mot en riktig MSSQL-instans sa dialektbrott i
  # migrationer eller appimport fangas fore deploy (jfr remark/tuple-IN-incidenterna).
  mssql-gate:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci!Passw0rd123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci!Passw0rd123' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    env:
      SECRET_KEY: test-secret
      SUPER_USER_USERNAMES: admin,emikad,mikhal
      EXCEL_API_TOKEN: test-token

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt pymssql

      - name: Create test database
        run: |
          python -c "
          import pymssql
          conn = pymssql.connect(server='127.0.0.1', port=1433, user='sa', password='Ci!Passw0rd123', database='master', login_timeout=30, autocommit=True)
          conn.cursor().execute('CREATE DATABASE flow_test')
          conn.close()
          "

      - name: Simulate Alembic build (MSSQL)
        working-directory: app
        env:
          DATABASE_URL: mssql+pymssql://sa:Ci!Passw0rd123@127.0.0.1:1433/flow_test?charset=utf8
          ENVIRONMENT: production
        run: |
          alembic upgrade head
          python -c "from backend.main import app; print(app.title)"
